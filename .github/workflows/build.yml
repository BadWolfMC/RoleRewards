name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon --warning-mode=all

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: RoleRewards-${{ github.sha }}
          path: |
            build/libs/RoleRewards-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and problem reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: RoleRewards-reports-${{ github.sha }}
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
